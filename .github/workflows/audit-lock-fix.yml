name: Repair vulnerable dependency lockfile (temporary)
on:
  push:
    branches: [fix/map-runtime-and-transport-validation-20261013]
permissions:
  contents: write
concurrency:
  group: audit-fix-villars
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fix compatible vulnerable versions in the lockfile
        run: npm audit fix --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Verify no high-severity advisory remains
        run: npm audit --audit-level=high
      - name: Publish repaired dependency snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): resolve published high-severity advisories"
            git push origin HEAD:fix/map-runtime-and-transport-validation-20261013
          fi
